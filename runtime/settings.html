<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>屏幕彼端 · 设置</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#d7dee8;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
.app{display:flex;height:100vh}
.side{width:200px;background:#0e131a;border-right:1px solid #1b2530;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid #1b2530}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#22c55e);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;background-size:cover;background-position:center}
.nm{font-weight:600;font-size:15px}
.st{font-size:11px;color:#5fbf7f}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;color:#93a1b1;text-decoration:none;font-size:13px;cursor:pointer}
.nav a:hover{background:#141b23;color:#d7dee8}
.nav a.on{background:#16202b;color:#e8eef6;box-shadow:inset 2px 0 0 #3b82f6}
.sidefoot{margin-top:auto;padding:12px 14px;font-size:11px;color:#55637a;border-top:1px solid #1b2530}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #1b2530;background:#0d1319}
.top h1{font-size:16px;margin:0;font-weight:600}
.top .sub{font-size:12px;color:#66768c}
.spacer{flex:1}
.btn{background:#1b2430;color:#cfdae8;border:1px solid #2a3745;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;font-size:13px}
.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.btn.danger{background:#3a1d1d;border-color:#5a2a2a;color:#ff9c9c}
.btn.ghost{background:transparent}
.btn:hover{filter:brightness(1.12)}
.btn.sm{padding:4px 9px;font-size:12px}
.body{flex:1;overflow:auto;padding:20px 22px 40px}
.wrap{max-width:1060px;display:flex;gap:18px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.col.side2{flex:0 0 300px}
.card{background:#101720;border:1px solid #1c2733;border-radius:12px;padding:15px 16px}
.card h2{font-size:13px;margin:0 0 12px;color:#93a6bd;font-weight:600}
.card h2 .tag{font-size:10px;color:#5f6d81;margin-left:8px;font-weight:400}
.row{display:flex;gap:12px;align-items:center;margin:9px 0}
.row label{width:88px;flex:0 0 auto;color:#8496ab;font-size:12.5px}
input[type=text],input[type=number],textarea,select{background:#0b1118;border:1px solid #26333f;color:#d7dee8;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;outline:none;width:100%}
input:focus,textarea:focus{border-color:#2563eb}
textarea{resize:vertical;line-height:1.65}
textarea.big{min-height:190px}
.hint{font-size:11px;color:#5a6878;margin-top:5px}
.chip{background:#131c26;border:1px solid #223041;color:#9fb0c3;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip.on{background:#16304f;border-color:#2f6bd8;color:#cfe0f7}
.fact{border:1px solid #1c2733;border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#0d141c}
.fact .t{font-size:13px;color:#cfdae8}
.fact .meta{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:11px;color:#65748a;flex-wrap:wrap}
.bar{height:5px;background:#1a2431;border-radius:999px;overflow:hidden;width:130px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e)}
.pill{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid #2a3745;color:#93a1b1}
.pill.core{border-color:#2f6bd8;color:#8fc1ff;background:#142238}
.pill.faint{border-color:#4a3a2a;color:#d8a86a}
.example{background:#0b1118;border-left:2px solid #2563eb;padding:7px 11px;border-radius:4px;color:#9fb0c3;font-size:12.5px;margin:6px 0}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat .s{background:#0d141c;border:1px solid #1c2733;border-radius:10px;padding:11px 13px}
.stat .s .n{font-size:19px;font-weight:600;color:#e8eef6}
.stat .s .l{font-size:11px;color:#6b7a8e}
.small{font-size:12px;color:#7d8fa5}
.slider{display:flex;align-items:center;gap:8px;flex:1}
input[type=range]{flex:1;accent-color:#2563eb}
.hidden{display:none}
.mode-banner{background:linear-gradient(135deg,#101c2e,#0e1725);border:1px solid #2f6bd8;border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 0 0 1px rgba(47,107,216,.15) inset}
#toast{position:fixed;right:20px;bottom:20px;background:#1f6feb;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:9}
.avatar{width:64px;height:64px;border-radius:50%;background:#16202b;display:flex;align-items:center;justify-content:center;font-size:22px;color:#9fb0c3;background-size:cover;background-position:center}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .wrap{width:100%;flex-wrap:wrap}
  .col.side2{flex:1 1 300px;min-width:280px;max-width:360px}
  .card{min-width:0;overflow:hidden}
  .row{flex-wrap:wrap;row-gap:8px}
  .row > input, .row > select, .row > textarea{max-width:100%}
  .fact .meta{flex-wrap:wrap;row-gap:6px}
  .fact .t{overflow-wrap:anywhere}
  @media (max-width:900px){ .wrap{flex-direction:column} .col.side2{flex:1 1 auto;width:100%;max-width:none} }

/* 0.6 UI polish：柔和的深色海面 + 更圆的卡片/按钮 */
body {
  background-image:
    radial-gradient(1000px 520px at 18% -8%, rgba(70, 130, 210, 0.16), transparent 62%),
    radial-gradient(900px 480px at 88% 108%, rgba(38, 170, 150, 0.10), transparent 58%);
  background-attachment: fixed;
}
.card, .stat, .fact, .box, .panel, .msg .bubble, .bubble {
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
}
button, .btn { border-radius: 10px; transition: transform .12s ease, background .18s ease, border-color .18s ease; }
button:hover, .btn:hover { transform: translateY(-1px); }
input, textarea, select { border-radius: 9px; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #2b3a4c; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #3b5068; }

</style>

<script>
const $ = (s) => document.querySelector(s);
let PERSONA = null, LIFE = null, MEM = null, CHARS = null;
let currentTab = 'role';
const TABS = {
  role: { title: '角色', sub: '人设卡决定她是谁、怎么说话' },
  life: { title: '生活', sub: '她的作息、什么时候做什么、空闲时干什么' },
  memory: { title: '记忆', sub: '她会淡忘，也会越提越深' },
  env: { title: '环境', sub: '她的电脑/屏幕/手机怎么连' },
  model: { title: '模型', sub: '用哪个模型、预算多少' },
  data: { title: '数据', sub: '存哪里、怎么备份' },
  tutorial: { title: '教程', sub: '怎么给她搭一台自己的电脑' },
};
function toast(t){ const el=$('#toast'); el.textContent=t; el.style.opacity=1; setTimeout(()=>el.style.opacity=0,1800); }
async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
async function saveJson(path, obj){ return await api(path, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(obj) }); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadPersona(){ PERSONA = await api('/api/persona'); renderNavAva(); }
async function setSelfStart(v){
  try { await api('/api/env', { method: 'POST', body: JSON.stringify({ selfStart: v }) }); toast(v === 'allow' ? '已允许她自己开机' : '已限制她自己开机'); }
  catch (e) { toast('保存失败'); }
  renderEnv();
}
async function envStartAll(){
  try { const r = await api('/api/env/start-all', { method: 'POST' }); toast(r.message || '正在启动'); }
  catch(e){ toast('启动失败'); }
  setTimeout(() => { renderEnv(); }, 3000);
}
async function envPower(kind, action){
  const label = kind === 'space' ? '她的屏幕' : '她的手机';
  if (action === 'stop' && !(await uiConfirm('关掉' + label + '？关掉后她就不能看/用这个环境了。'))) return;
  try {
    const r = await api('/api/' + kind + '/' + action, { method: 'POST' });
    toast(r.message || (action === 'stop' ? '已关闭' : '启动中…'));
  } catch (e) { toast('操作失败'); }
  setTimeout(() => { renderEnv(); }, 1200);
}
async function runEnvCheck(){
  const box = document.getElementById('envCheckBox');
  if (!box) return;
  box.textContent = '检查中…';
  try {
    const r = await api('/api/env/check');
    let html = '';
    for (const c of (r.checks || [])) html += (c.ok ? '✅ ' : '❌ ') + esc(c.label) + '：' + esc(c.detail) + '<br>';
    if (r.hints && r.hints.length) html += '<div style="margin-top:8px;color:#e0b37a">建议：<br>' + r.hints.map(h => '· ' + esc(h)).join('<br>') + '</div>';
    box.innerHTML = html || '没有检查项';
  } catch (e) { box.textContent = '自检失败：' + e.message; }
}
async function installAdbKeyboard(){
  toast('正在安装 ADBKeyboard…');
  try {
    const r = await api('/api/env/install-adbkeyboard', { method: 'POST' });
    toast(r.ok ? '安装成功' : '安装失败');
    if (r.steps) console.log('ADBKeyboard:', r.steps.join(' | '));
    runEnvCheck();
  } catch (e) { toast('安装失败：先确认手机已启动'); }
}
async function petRefresh(){
  const box = document.getElementById('petBox');
  if (!box) return;
  try {
    const r = await api('/api/pet');
    const p = r.pet || {};
    box.innerHTML = '状态：' + (r.running ? '🟢 运行中' : '⚪ 未开启') + ' · 形象：' + esc(p.image || 'avatar') + ' · 大小 ' + esc(p.size || 180) + 'px';
  } catch (e) { box.textContent = '读取失败：' + e.message; }
}
async function petToggle(on){
  try { await saveJson('/api/pet', { enabled: on }); toast(on ? '桌宠已开启' : '桌宠已关闭'); petRefresh(); } catch (e) { toast('操作失败'); }
}

function collectPersona(){
  const traits = {};
  document.querySelectorAll('input[id^=trait_]').forEach(el=>{ traits[el.id.slice(6)] = Number(el.value); });
  const ageVal = Number($('#pAge').value);
  return {
    meta: {
      name: $('#pName').value, userCall: $('#pUser').value, relation: $('#pRel').value,
      avatar: PERSONA.meta.avatar || '', examples: PERSONA.meta.examples || [], traits,
      age: ageVal > 0 ? ageVal : null,
      license: $('#pLicense').checked,
      travelPref: $('#pPref').value || 'auto',
      model: { type: $('#pModelType').value || 'none', url: $('#pModelUrl').value.trim(), scale: Number($('#pModelScale').value) || 1 },
    },
    body: $('#pBody').value,
  };
}

async function loadEconomyUi(){
  try {
    const r = await api('/api/economy');
    const e = r.economy || {}, w = r.wallet || {};
    const setV = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    setV('ecoInitial', e.initialBalance); setV('ecoDaily', e.dailyIncome); setV('ecoWage', e.wagePerHour);
    setV('ecoMeal', e.mealCost); setV('ecoEnt', e.entertainmentCost);
    setV('ecoTokenBudget', e.tokenBudget); setV('ecoPerYuan', e.tokensPerYuan);
    const en = document.getElementById('ecoEnabled'); if (en) en.checked = e.enabled !== false;
    const mt = document.getElementById('ecoMoneyType'); if (mt) mt.value = e.moneyType === 'token' ? 'token' : 'virtual';
    const wt = document.getElementById('ecoWallet');
    const rb = r.realBalance || {};
    if (wt) wt.textContent = w.tokenMode
      ? '用户实时余额 ' + (rb.ok ? '¥' + Number(rb.total).toFixed(2) : '读取失败') + ' · 今日消耗 ¥' + (rb.ok && rb.todayRmb !== undefined ? Number(rb.todayRmb).toFixed(2) : '0.00') + ' · 你的虚拟零花钱 ' + (w.spendable !== undefined ? w.spendable : '-') + ' 元'
      : '虚拟余额 ' + (w.spendable !== undefined ? w.spendable : '-') + ' 元 · Token 已用 ' + Number(w.usedTokens || 0).toLocaleString();
  } catch (err) {}
}

  const body = {

function renderPins(){
  const wrap = document.getElementById('mapPins');
  if (!wrap) return;
  wrap.innerHTML = '';
  MAPPLACES.forEach((p, i) => {
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;transform:translate(-50%,-100%);cursor:grab;user-select:none;text-align:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))';
    el.innerHTML = '<div style="font-size:22px">'+esc(p.icon)+'</div>'
      + '<div style="font-size:11px;color:#4d6078;background:rgba(255,255,255,.9);padding:1px 6px;border-radius:8px;border:1px solid rgba(160,132,105,.25);white-space:nowrap">'+esc(p.name)+'</div>'
      + '<div style="width:2px;height:8px;background:#2a3a4a;margin:0 auto"></div>';
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      const box = document.getElementById('mapWrap').getBoundingClientRect();
      const move = (e) => {
        const x = Math.max(0.05, Math.min(0.95, (e.clientX - box.left) / box.width));
        const y = Math.max(0.08, Math.min(0.92, (e.clientY - box.top) / box.height));
        p.x = x; p.y = y;
        el.style.left = (x*100)+'%'; el.style.top = (y*100)+'%';
      };
      const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    wrap.appendChild(el);
  });
}

function factRow(f){

  const cls = f.pinned||s>=0.85 ? 'core' : (s<0.2?'faint':'');

  return '<div class="fact"><div class="t">'+esc(f.text)+'</div><div class="meta">'
    + (label?'<span class="pill '+cls+'">'+label+'</span>':'')
    + '<span>清晰度</span><div class="bar"><i style="width:'+Math.round(s*100)+'%"></i></div><span>'+Math.round(s*100)+'%</span>'
    + '<span>提到 '+(f.hitCount||1)+' 次</span>'
    + '<span style="margin-left:auto">'
    + '<button class="btn sm ghost" onclick="pinFact('+f.id+')">'+(f.pinned?'取消置顶':'置顶')+'</button> '
    + '<button class="btn sm danger" onclick="delFact('+f.id+')">删除</button></span>'
    + '</div></div>';
}

async function importMemoryFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast('文件太大，建议小于 2MB'); input.value = ''; return; }
  try {
    const text = await f.text();
    const r = await saveJson('/api/memory/import', { text, importance: 0.5 });
    if (r.ok) {
      toast('导入 ' + r.total + ' 条：新增 ' + r.added + '，合并 ' + r.merged);
      input.value = '';
      renderMemory(true);
    } else {
      toast(r.error || '导入失败');
    }
  } catch (e) {
    toast('读取文件失败');
  }
}

    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">'
    + '<strong style="font-size:16px;color:var(--t-text,#2f3c4f)">教程目录</strong>'
    + '<input id="tutSearch" type="search" placeholder="搜索教程，例如：桌宠 / 体力 / 备份 / 3D" style="flex:1;min-width:220px;padding:9px 12px;border-radius:10px;border:1px solid var(--t-line,#e0d5c8);background:var(--t-input,#fff);color:var(--t-text,#2f3c4f)">'
    + '</div>'
    + '<div id="tutToc" style="max-height:150px;overflow:auto;padding:4px 0 10px;border-bottom:1px solid var(--t-line,#eee);margin-bottom:12px">' + tocHtml + '</div>'
    + '<div id="tutContent" style="line-height:1.95;font-size:14.5px">' + bodyHtml + '</div>'
    + '<div id="tutEmpty" style="display:none;padding:26px;text-align:center;color:var(--t-muted,#6b7d90)">没有找到匹配的内容</div>'
    + '</div></div><div class="col side2"><div class="card"><h2>状态</h2><div class="small">当前模式：'+(((window._mode||{}).effective==='full')?'完整版':'纯聊天版')+'</div>'
    + '<button class="btn ghost" style="width:100%;margin-top:8px" onclick="location.hash=\'env\'">去环境页检测</button></div>'
    + '<div class="card"><h2>说明</h2><div class="small">装好教程里的环境后回到插件，横幅会自动变成「完整版」，不用手动切。</div></div></div></div>';
  const search = document.getElementById('tutSearch');
  const content = document.getElementById('tutContent');
  const empty = document.getElementById('tutEmpty');
  if (search && content) {
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      let shown = 0;
      content.querySelectorAll('.tutBlock').forEach(el => {
        const hit = !q || el.textContent.toLowerCase().includes(q);
        el.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      if (empty) empty.style.display = shown ? 'none' : 'block';
    });
  }
  document.querySelectorAll('#tutToc a').forEach(a => a.addEventListener('click', (e) => {
    e.preventDefault();
    const el = document.querySelector(a.getAttribute('href'));
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }));
}
async function doBackup(){
  try { const r = await api('/api/backup', { method: 'POST' }); toast(r.message || '正在备份'); }
  catch(e){ toast('备份失败'); }
}
async function renderData(){
  $('#topAction').innerHTML = '';
  let dataRoot = '%USERPROFILE%\\.dsh-companion';
  try { const st = await api('/api/status'); dataRoot = (st.setup && st.setup.dataRoot) || dataRoot; } catch(e){}
  const dp = (p) => dataRoot.replace(/[\\\/]+$/, '') + '\\' + p;
  $('#body').innerHTML = '<div class="wrap"><div class="col">'
  + '<div class="card"><h2>数据目录</h2>'
  + '<div class="row"><label>数据根目录</label><input type="text" value="'+esc(dataRoot)+'" disabled></div>'
  + '<div class="row"><label>人设</label><input type="text" value="'+esc(dp('persona.md'))+'" disabled></div>'
  + '<div class="row"><label>记忆/日记/聊天</label><input type="text" value="'+esc(dp('data'))+'" disabled></div>'
  + '</div>'
  + '<div class="card"><h2>备份</h2><div class="small">导出把数据目录打包成 zip；导入覆盖恢复。系统每天凌晨 4 点后会自动备份一次。<br>备份/恢复也可以双击插件 scripts 目录里的 <b>backup.cmd</b> / <b>restore.cmd</b>，已使用 ExecutionPolicy Bypass，不需要你改系统执行策略。</div>'
  + '<div class="row"><button class="btn primary" onclick="doBackup()">立即备份</button><span class="hint" style="flex:1;margin-left:8px">备份到数据目录下的 backups</span></div><button class="btn ghost" style="margin-top:8px" onclick="doBackup()">备份到数据目录</button></div>'
  + '</div><div class="col side2"><div class="card"><h2>版本</h2><div class="small">v0.6.1 · 本地运行时</div></div></div></div>';
}


let UI_THEMES = [], UI_THEME = 'warm';
function applyUiTheme(id){
  UI_THEME = id || 'warm';
  document.documentElement.dataset.theme = UI_THEME;
  document.querySelectorAll('.themeDot').forEach(d => d.classList.toggle('on', d.dataset.theme === UI_THEME));
}
function renderThemeDots(){
  const host = document.getElementById('themeDots');
  if (!host || !UI_THEMES.length) return;
  host.innerHTML = UI_THEMES.map(t => '<button class="themeDot'+ (t.id===UI_THEME?' on':'') +'" data-theme="'+esc(t.id)+'" title="'+esc(t.name)+'" onclick="chooseUiTheme(\''+esc(t.id)+'\')"></button>').join('');
}
async function loadUiTheme(){
  try {
    const r = await api('/api/ui-theme');
    UI_THEMES = r.themes || [];
    applyUiTheme(r.current || 'warm');
    renderThemeDots();
  } catch(e) {}
}
async function chooseUiTheme(id){
  applyUiTheme(id);
  renderThemeDots();
  try { await saveJson('/api/ui-theme', {id}); toast('配色已切换'); } catch(e) { toast('保存失败'); }
}

// ================= router =================
async function go(tab){
  currentTab = tab;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on', a.dataset.tab===tab));
  $('#tabTitle').textContent = TABS[tab].title;
  $('#tabSub').textContent = TABS[tab].sub;
  const body = $('#body'); body.innerHTML = '<div class="small">加载中…</div>';
  if(!PERSONA){ try { await loadPersona(); renderNavAva(); } catch(e){} }
  try {
    if(tab==='role'){ if(!PERSONA) await loadPersona(); await loadChars(); renderRole(); }
    else if(tab==='life'){ if(!LIFE) await loadLife(); renderLife(); setTimeout(()=>{ try{ petRefresh(); }catch(e){} }, 120); }
    else if(tab==='memory'){ await renderMemory(); }
    else if(tab==='env'){ await renderEnv(); }
    else if(tab==='model'){ await renderModel(); }
    else if(tab==='data'){ await renderData(); }
    else if(tab==='tutorial'){ await renderTutorial(); }
  } catch(e){ body.innerHTML = '<div class="small">加载失败：'+esc(e.message)+'</div>'; }
  try { window._mode = await api('/api/mode'); } catch(e){ window._mode = window._mode || { override: 'auto', effective: 'full', detected: null }; }
  renderModeBanner();
}
function renderModeBanner(){
  const host = document.getElementById('modeHost');
  if (!host) return;
  const info = window._mode || {};
  const eff = info.effective || 'full';
  const ov = info.override || 'auto';
  const d = info.detected || {};
  const detectedTxt = d.ok
    ? '检测到虚拟屏幕 ✔' + (d.waydroid ? '（手机也在）' : '') + ' → 自动使用完整版'
    : '未检测到虚拟屏幕 → 自动使用纯聊天版';
  host.innerHTML = '<div class="mode-banner" style="margin-top:14px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
    + '<div style="font-size:22px">'+(eff==='full'?'🖥️📱':'💬')+'</div>'
    + '<div style="flex:1;min-width:240px"><div style="font-weight:600;font-size:15px">当前模式：'+(eff==='full'?'完整版 · 她有自己的屏幕和手机':'纯聊天版 · 只有对话')+'</div>'
    + '<div class="small" style="margin-top:2px">'+detectedTxt+'</div>'
    + '<div class="small" style="color:#55637a;margin-top:2px">覆盖设置：'+(ov==='auto'?'自动':(ov==='chat'?'强制纯聊天':'强制完整版'))+'</div></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn '+(ov==='auto'?'primary':'ghost')+'" onclick="setMode(\'auto\')">自动检测</button>'
    + '<button class="btn '+(ov==='chat'?'primary':'ghost')+'" onclick="setMode(\'chat\')">纯聊天</button>'
    + '<button class="btn '+(ov==='full'?'primary':'ghost')+'" onclick="setMode(\'full\')">完整版</button>'
    + '<button class="btn ghost" onclick="location.hash=\'tutorial\'">📖 接入教程</button>'
    + '</div></div></div>';
}
async function setMode(m){
  const r = await saveJson('/api/mode', { override: m });
  if(r.ok){ window._mode = { override: r.override, detected: r.detected, effective: r.effective }; toast(m==='auto'?'已设为自动检测':(m==='chat'?'已强制纯聊天':'已强制完整版')); go(currentTab); }
}
document.querySelectorAll('.nav a').forEach(a=>a.onclick = () => { location.hash = a.dataset.tab; });
window.addEventListener('hashchange', () => go((location.hash||'#role').slice(1)));
loadUiTheme();
go((location.hash||'#role').slice(1));
</script></body></html>
