<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>3D 舞台 · 屏幕彼端</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#d7dee8}
#app{position:fixed;inset:0}
#hud{position:fixed;left:14px;top:12px;background:rgba(8,13,20,.78);border:1px solid #2a3745;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.8;backdrop-filter:blur(4px)}
#hud .name{font-weight:600;font-size:15px}
#hud .row{font-size:12px;color:#9fb3c8}
#hud a{color:#59a6ff;text-decoration:none;font-size:12px;margin-right:10px}
#hud .hint{font-size:11px;color:#5a6878;margin-top:4px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#7f8c9b;font-size:13px;z-index:9}
</style>
<link rel="stylesheet" href="/theme.css"></head><body>
<div id="app"></div>
<div id="wxOverlay" style="position:fixed;inset:0;pointer-events:none;z-index:2"></div>
<div id="hud">
  <div class="name" id="hName">…</div>
  <div class="row" id="hWhere">…</div>
  <div class="row" id="hStatus">…</div>
  <div class="row" id="hMoney">…</div>
  <div class="row"><a href="/">聊天</a><a href="/screen" target="_blank">屏幕</a><a href="/map">2D 地图</a><a href="/stage">2D 舞台</a><a href="/settings">设置</a></div>
  <div class="hint">拖拽画面旋转 · 滚轮缩放 · 地图模型在「地图→地图设置→地图模型」里配</div>
</div>
<div id="loading">three.js 加载中…</div>
<script src="/wx.js"></script>
<script type="importmap">{"imports":{"three":"/vendor/three.module.min.js","three/addons/":"/vendor/addons/"}}</script>
<script>
window.addEventListener('error', (e) => { const el = document.getElementById('loading'); if (el) el.textContent = 'JS错误：' + (e.message || e.error); });
window.addEventListener('unhandledrejection', (e) => { const el = document.getElementById('loading'); if (el) el.textContent = 'Promise错误：' + (e.reason && e.reason.message ? e.reason.message : e.reason); });
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
app.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a2c3a, 140, 320);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);

const WORLD_W = 120, WORLD_H = 77; // 世界尺寸（对应地图归一化坐标）
function toWorld(x, y) { return new THREE.Vector3((x - 0.5) * WORLD_W, 0, (y - 0.5) * WORLD_H); }

// 灯光
const hemi = new THREE.HemisphereLight(0xdceeff, 0x2a3a2a, 1.0); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xfff4e0, 2.3);
dir.position.set(40, 70, 25);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -90; dir.shadow.camera.right = 90;
dir.shadow.camera.top = 90; dir.shadow.camera.bottom = -90;
dir.shadow.camera.near = 1; dir.shadow.camera.far = 220;
dir.shadow.bias = -0.0005;
scene.add(dir);
const ambient = new THREE.AmbientLight(0x445566, 0.65); scene.add(ambient);

// 地面 + 主题
const themeColors = { town: 0x1d3a33, coast: 0x14425c, city: 0x22303c, forest: 0x1b3325 };
let ground, grid;
function buildGround(theme, imageUrl) {
  if (ground) { scene.remove(ground); ground.geometry.dispose(); ground.material.dispose(); ground = null; }
  const g = new THREE.PlaneGeometry(WORLD_W, WORLD_H);
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 });
  if (imageUrl) {
    const tex = new THREE.TextureLoader().load(imageUrl);
    tex.colorSpace = THREE.SRGBColorSpace;
    m.map = tex; m.color.set(0xffffff);
  } else {
    m.color.set(themeColors[theme] || themeColors.town);
  }
  ground = new THREE.Mesh(g, m); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
  const sky = { town: 0x0d1a24, coast: 0x0a1c2c, city: 0x0d1218, forest: 0x0b1812 }[theme] || 0x0d1a24;
  scene.background = new THREE.Color(sky);
  scene.fog.color.set(sky);
  if (!grid) {
    grid = new THREE.GridHelper(WORLD_W, 24, 0x2a3a44, 0x22303a);
    grid.position.y = 0; scene.add(grid);
  }
  // 道路（简化十字路）
  for (const r of roadMeshes || []) scene.remove(r);
  roadMeshes = [];
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a3a44, roughness: 0.9 });
  const road1 = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_W, 7), roadMat);
  road1.rotation.x = -Math.PI / 2; road1.rotation.z = 0.05; road1.position.set(0, 0.01, 0); scene.add(road1);
  const road2 = new THREE.Mesh(new THREE.PlaneGeometry(6, WORLD_H), roadMat);
  road2.rotation.x = -Math.PI / 2; road2.position.set(0, 0.01, 6); scene.add(road2);
  roadMeshes.push(road1, road2);
}
let roadMeshes = [];

// 地点标记（小圆柱 + 文字精灵）
let markerGroup = new THREE.Group(); scene.add(markerGroup);
function labelSprite(text, icon) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(10,17,24,0.85)'; roundRect(ctx, 16, 30, 224, 68, 16); ctx.fill();
  ctx.strokeStyle = '#2f6bd8'; ctx.lineWidth = 4; roundRect(ctx, 16, 30, 224, 68, 16); ctx.stroke();
  ctx.fillStyle = '#d7e3ee'; ctx.font = 'bold 40px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText((icon || '') + ' ' + text, 128, 78);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, fog: false });
  const sp = new THREE.Sprite(mat); sp.scale.set(13, 6.5, 1); return sp;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
let placesKey = '';
function buildPlaces(places) {
  const key = JSON.stringify(places.map(p => [p.id, p.x, p.y, p.name, p.icon]));
  if (key === placesKey) return;
  placesKey = key;
  markerGroup.clear();
  for (const p of places) {
    const v = toWorld(p.x, p.y);
    if (p.image) {
      const tex = new THREE.TextureLoader().load(p.image);
      tex.colorSpace = THREE.SRGBColorSpace;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false }));
      sp.scale.set(7, 7, 1); sp.position.set(v.x, 4.5, v.z); markerGroup.add(sp);
    } else {
      const mat = new THREE.MeshStandardMaterial({ color: 0x2f6bd8, emissive: 0x123056, roughness: .6 });
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.0, 2.4, 16), mat);
      pin.position.set(v.x, 1.2, v.z); markerGroup.add(pin);
    }
    const label = labelSprite(p.name, p.image ? '' : p.icon); label.position.set(v.x, 8, v.z); markerGroup.add(label);
  }
}

// 角色
let charGroup = new THREE.Group(); scene.add(charGroup);
let charKind = '', charUrl = '', mixer = null, charModel = null;
let spriteTex = null, spritePlane = null, fallbackBody = null, shadowBlob = null;
function clearChar() {
  charGroup.clear();
  if (mixer) { mixer.stopAllAction(); mixer = null; }
  if (spriteTex) { spriteTex.dispose(); spriteTex = null; }
  spritePlane = null; charModel = null; fallbackBody = null;
}
async function buildChar(character) {
  const model = character.model || { type: 'none', url: '', scale: 1 };
  const kindKey = model.type + '|' + (model.url || '') + '|' + (model.scale || 1);
  if (kindKey === charKind) return;
  charKind = kindKey;
  clearChar();
  const scale = Number(model.scale) || 1;
  const loader = new THREE.TextureLoader();
  const makeSprite = (url, height = 20) => new Promise((resolve) => {
    loader.load(url, (tex) => {
      spriteTex = tex;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false });
      const sp = new THREE.Sprite(mat);
      const aspect = (tex.image && tex.image.width && tex.image.height) ? tex.image.width / tex.image.height : 1;
      sp.scale.set(height * aspect, height, 1);
      charGroup.add(sp); spritePlane = sp; resolve();
    }, undefined, () => resolve());
  });
  const makeFallback = () => {
    fallbackBody = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(1.4, 4, 6, 12), new THREE.MeshStandardMaterial({ color: 0x5f8fe8, roughness: .5 }));
    body.position.y = 3.4; fallbackBody.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(1.5, 20, 16), new THREE.MeshStandardMaterial({ color: 0xffe9dc, roughness: .6 }));
    head.position.y = 7.2; fallbackBody.add(head);
    charGroup.add(fallbackBody);
  };
  const nameTag = labelSprite(character.name || '她', '');
  nameTag.scale.set(11, 5.5, 1);
  nameTag.position.set(0, 26, 0);
  charGroup.add(nameTag);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(3.2, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.02; charGroup.add(blob); shadowBlob = blob;
  const ring = new THREE.Mesh(new THREE.RingGeometry(3.4, 4.2, 32), new THREE.MeshBasicMaterial({ color: 0x59a6ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; charGroup.add(ring);
  if (model.type === '3d' && model.url) {
    try {
      const gltf = await new GLTFLoader().loadAsync(model.url);
      gltf.scene.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      charModel = gltf.scene;
      charModel.scale.setScalar(scale);
      const box = new THREE.Box3().setFromObject(charModel);
      charModel.position.y = -box.min.y;
      charGroup.add(charModel);
      if (gltf.animations && gltf.animations.length) { mixer = new THREE.AnimationMixer(charModel); mixer.clipAction(gltf.animations[0]).play(); }
    } catch (e) { makeFallback(); }
  } else if ((model.type === 'sprite' || model.type === 'live2d') && model.url) {
    await makeSprite(model.url, 20 * scale);
    if (!spritePlane) makeFallback();
  } else if (character.avatar) {
    await makeSprite(character.avatar, 20 * scale);
    if (!spritePlane) makeFallback();
  } else {
    makeFallback();
  }
}

// 路径线
let routeLine = null;
function drawPath(path) {
  if (routeLine) { scene.remove(routeLine); routeLine.geometry.dispose(); routeLine = null; }
  if (!path || path.length < 2) return;
  const pts = path.map(p => { const v = toWorld(p.x, p.y); v.y = 0.3; return v; });
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({ color: 0x7db7ff, dashSize: 2.4, gapSize: 1.2, linewidth: 3 });
  routeLine = new THREE.Line(geo, mat); routeLine.computeLineDistances(); scene.add(routeLine);
}

// 状态轮询
let stage = null;
async function poll() {
  try { const r = await fetch('/api/stage'); stage = await r.json(); apply(); }
  catch (e) { const el = document.getElementById('loading'); if (el) el.textContent = 'stage 拉取失败：' + e.message; }
}
function characterWorldPos() {
  if (!stage) return new THREE.Vector3();
  const loc = stage.location;
  if (loc.state === 'stationary') {
    const p = stage.map.places.find(x => x.id === loc.placeId) || { x: 0.5, y: 0.5 };
    return toWorld(p.x, p.y);
  }
  if (loc.state === 'traveling' && loc.traveling && loc.traveling.path && loc.traveling.path.length > 1) {
    const t = loc.traveling;
    const path = t.path;
    const prog = Math.min(1, Math.max(0, (Date.now() - t.startedAt) / Math.max(1, t.durationMs)));
    let total = 0; const segs = [];
    for (let i = 0; i < path.length - 1; i++) { const d = Math.hypot(path[i].x - path[i + 1].x, path[i].y - path[i + 1].y); segs.push(d); total += d; }
    let target = total * prog;
    for (let i = 0; i < segs.length; i++) {
      if (target <= segs[i] || i === segs.length - 1) {
        const r = segs[i] ? target / segs[i] : 0;
        const nx = path[i].x + (path[i + 1].x - path[i].x) * Math.min(1, Math.max(0, r));
        const ny = path[i].y + (path[i + 1].y - path[i].y) * Math.min(1, Math.max(0, r));
        return toWorld(nx, ny);
      }
      target -= segs[i];
    }
  }
  return toWorld(0.5, 0.2);
}
function apply() {
  if (!stage) return;
  const loc = stage.location, ch = stage.character;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hName').textContent = ch.name || '她';
  const where = loc.state === 'intercity' ? ('前往 ' + (loc.intercity && loc.intercity.toMapName))
    : loc.state === 'traveling' ? ('去 ' + (loc.traveling && loc.traveling.toName) + ' 的路上')
    : (loc.icon + ' ' + loc.placeName + ' · ' + stage.map.name);
  document.getElementById('hWhere').textContent = where + ' · ' + stage.weather.icon + stage.weather.label + (stage.weather.temp !== null && stage.weather.temp !== undefined ? ' ' + stage.weather.temp + '°C' : '');
  const wm2 = stage.wallet;
  const hm = document.getElementById('hMoney');
  if (hm) hm.textContent = wm2 ? ('💰 ' + (wm2.spendable !== undefined ? wm2.spendable : wm2.balance) + ' 元 · 🪙 剩余 ' + Number(wm2.remainingTokens || 0).toLocaleString() + ' token') : '';
  document.getElementById('hStatus').textContent = '体力 ' + stage.energy + ' · ' + stage.animationHint
    + (loc.state === 'traveling' ? ' · ' + loc.traveling.modeLabel + ' · 剩 ' + Math.max(1, Math.ceil(loc.traveling.etaSec / 60)) + ' 分钟' : '');
  const phase = (function(h){ if (h>=5&&h<7) return 'dawn'; if (h>=7&&h<17) return 'day'; if (h>=17&&h<19.5) return 'dusk'; return 'night'; })(new Date().getHours() + new Date().getMinutes()/60);
  const wxKind = (stage.weather && stage.weather.kind) || 'sunny';
  if (window.CompanionWeatherFx) CompanionWeatherFx.set(document.getElementById('wxOverlay'), wxKind, (stage.weather && stage.weather.fx) || {});
  let wxSky = { rain: 0x1a2531, snow: 0x2a3640, sunny: 0x0d1a24, hot: 0x2a1a12, cold: 0x16222e, windy: 0x19232c, cloudy: 0x141d26 }[wxKind] || 0x0d1a24;
  const todSky = { dawn: 0x3a2a3a, day: 0x0d1a24, dusk: 0x2a1a24, night: 0x05070f }[phase];
  if (phase === 'night') wxSky = 0x05070f;
  else if (phase === 'dawn' || phase === 'dusk') wxSky = new THREE.Color(wxSky).lerp(new THREE.Color(todSky), 0.45).getHex();
  scene.background = new THREE.Color(wxSky);
  scene.fog.color.set(wxSky);
  const dayFactor = phase === 'day' ? 1 : phase === 'dawn' || phase === 'dusk' ? 0.7 : 0.35;
  hemi.intensity = phase === 'day' ? 1.0 : phase === 'night' ? 0.35 : 0.68;
  ambient.intensity = phase === 'day' ? 0.65 : phase === 'night' ? 0.22 : 0.45;
  dir.intensity = (wxKind === 'rain' || wxKind === 'snow' ? 1.5 : (wxKind === 'sunny' ? 2.4 : 2.0)) * dayFactor;
  buildGround(stage.map.theme, stage.map.image && stage.map.image.url ? stage.map.image.url : '');
  buildEnv(stage.map);
  buildPlaces(stage.map.places);
  buildChar(ch).catch(() => {});
  drawPath(loc.state === 'traveling' && loc.traveling ? loc.traveling.path : null);
}

// 地图模型（3D 地图导入）
let envGroup = new THREE.Group(); scene.add(envGroup);
let envKey = '';
async function buildEnv(map) {
  const model = map.model;
  const key = model && model.url ? (model.url + '|' + (model.scale || 1) + '|' + (model.rotationY || 0) + '|' + (model.yOffset || 0)) : 'proc|' + (map.theme || 'town');
  if (key === envKey) return;
  envKey = key;
  envGroup.clear();
  const hideProcedural = !!(model && model.url);
  if (ground) ground.visible = !hideProcedural;
  if (grid) grid.visible = !hideProcedural;
  for (const r of roadMeshes || []) r.visible = !hideProcedural;
  if (!hideProcedural) return;
  try {
    const gltf = await new GLTFLoader().loadAsync(model.url);
    const obj = gltf.scene;
    obj.scale.setScalar(Number(model.scale) || 1);
    obj.rotation.y = (Number(model.rotationY) || 0) * Math.PI / 180;
    obj.position.y = Number(model.yOffset) || 0;
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    envGroup.add(obj);
  } catch (e) {
    document.getElementById('hStatus').textContent = '地图模型加载失败：' + (e && e.message ? e.message : e);
    if (ground) ground.visible = true;
  }
}

// 相机：跟随 + 拖拽旋转 + 滚轮缩放
let camTarget = new THREE.Vector3(0, 0, 0);
let yaw = 0.9, pitch = 0.72, dist = 105;
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch = Math.min(1.35, Math.max(0.18, pitch - (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.min(260, Math.max(30, dist + (e.deltaY > 0 ? 8 : -8)));
}, { passive: false });
function animate() {
  requestAnimationFrame(animate);
  const p = characterWorldPos();
  camTarget.lerp(p, 0.08);
  const cx = camTarget.x + Math.sin(yaw) * Math.cos(pitch) * dist;
  const cz = camTarget.z + Math.cos(yaw) * Math.cos(pitch) * dist;
  const cyv = camTarget.y + 6 + Math.sin(pitch) * dist;
  camera.position.lerp(new THREE.Vector3(cx, cyv, cz), 0.1);
  camera.lookAt(camTarget.x, camTarget.y + 5, camTarget.z);
  const prev = charGroup.position.clone();
  charGroup.position.lerp(p, 0.12);
  if (spritePlane) spritePlane.lookAt(camera.position);
  for (const c of charGroup.children) { if (c.isSprite && c.position.y > 20) c.lookAt(camera.position); }
  const st = stage && stage.location ? stage.location : null;
  const traveling = !!(st && st.traveling);
  if (traveling) {
    const dx = charGroup.position.x - prev.x, dz = charGroup.position.z - prev.z;
    if (Math.abs(dx) + Math.abs(dz) > 0.0005) {
      const targetYaw = Math.atan2(dx, dz);
      let cur = charGroup.rotation.y;
      let d = targetYaw - cur;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      charGroup.rotation.y = cur + d * 0.15;
    }
    charGroup.position.y = Math.abs(Math.sin(performance.now() / 160)) * 0.35;
  } else {
    charGroup.position.y *= 0.9;
  }
  if (mixer) mixer.update(0.016);
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
poll(); setInterval(poll, 1000);
animate();
</script></body></html>
