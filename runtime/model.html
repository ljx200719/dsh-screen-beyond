<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 资源释放：切换地面/地形/模型时避免 GPU 内存泄漏
function disposeMaterial(m, keepMaterials) {
  if (!m || (keepMaterials && keepMaterials.has(m))) return;
  for (const k of ['map', 'normalMap', 'emissiveMap']) if (m[k]) m[k].dispose();
  m.dispose();
}
function disposeObject3D(obj, keepMaterials) {
  if (!obj || typeof obj.traverse !== 'function') return;
  obj.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => disposeMaterial(m, keepMaterials));

}

  if (!group) return;

}

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });

app.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x1a2c3a, 140, 320);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);

const WORLD_W = 120, WORLD_H = 77; // 世界尺寸（对应地图归一化坐标）
function toWorld(x, y) { return new THREE.Vector3((x - 0.5) * WORLD_W, 0, (y - 0.5) * WORLD_H); }

// 灯光
const hemi = new THREE.HemisphereLight(0xdceeff, 0x2a3a2a, 1.0); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xfff4e0, 2.3);
dir.position.set(40, 70, 25);
dir.castShadow = true;
dir.shadow.mapSize.set(2048, 2048);
dir.shadow.camera.left = -90; dir.shadow.camera.right = 90;
dir.shadow.camera.top = 90; dir.shadow.camera.bottom = -90;
dir.shadow.camera.near = 1; dir.shadow.camera.far = 220;
dir.shadow.bias = -0.0005;
scene.add(dir);
const ambient = new THREE.AmbientLight(0x445566, 0.65); scene.add(ambient);
// 3D 底座：让官方地图像一座海岛模型，不再悬在空网格里
const basePlane = new THREE.Mesh(
  new THREE.PlaneGeometry(190, 130),
  new THREE.MeshStandardMaterial({ color: 0x163447, roughness: 1, metalness: 0.02 })
);
basePlane.rotation.x = -Math.PI / 2;
basePlane.position.y = -0.55;
basePlane.receiveShadow = true;
scene.add(basePlane);

// 地面 + 主题
const themeColors = { town: 0x1d3a33, coast: 0x14425c, city: 0x22303c, forest: 0x1b3325 };
let ground, grid, groundKey = '';
function buildGround(theme, imageUrl, has3d) {
  const key = String(theme) + '|' + (imageUrl || '') + '|' + (has3d ? '3d' : '2d');
  if (key === groundKey) return;
  groundKey = key;
  if (ground) { scene.remove(ground); disposeObject3D(ground); ground = null; }
  const g = new THREE.PlaneGeometry(WORLD_W, WORLD_H);
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 });
  if (imageUrl) {
    const tex = new THREE.TextureLoader().load(imageUrl);
    tex.colorSpace = THREE.SRGBColorSpace;
    m.map = tex; m.color.set(0xffffff);
  } else {
    m.color.set(themeColors[theme] || themeColors.town);
  }
  ground = new THREE.Mesh(g, m); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
  // 官方地图底图已经是完整画面：隐藏程序化道路/网格，避免把画切碎
  if (imageUrl) {
    try { roadMeshes.forEach((rm) => { rm.visible = false; }); } catch (e) {}
    if (grid) grid.visible = false;
    if (typeof townGroup !== 'undefined') townGroup.visible = false;
  } else {
    try { roadMeshes.forEach((rm) => { rm.visible = true; }); } catch (e) {}
    if (grid) grid.visible = true;
    if (typeof townGroup !== 'undefined') townGroup.visible = true;
  }
  const sky = { town: 0x0d1a24, coast: 0x0a1c2c, city: 0x0d1218, forest: 0x0b1812 }[theme] || 0x0d1a24;
  scene.background = new THREE.Color(sky);
  scene.fog.color.set(sky);
  if (!grid) {
    grid = new THREE.GridHelper(WORLD_W, 24, 0x2a3a44, 0x22303a);
    grid.position.y = 0; grid.visible = false; scene.add(grid);
  }
  // 道路（简化十字路）
  for (const r of roadMeshes || []) { scene.remove(r); disposeObject3D(r); }
  roadMeshes = [];
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a3a44, roughness: 0.9 });
  const road1 = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_W, 7), roadMat);
  road1.rotation.x = -Math.PI / 2; road1.rotation.z = 0.05; road1.position.set(0, 0.01, 0); scene.add(road1);
  const road2 = new THREE.Mesh(new THREE.PlaneGeometry(6, WORLD_H), roadMat);
  road2.rotation.x = -Math.PI / 2; road2.position.set(0, 0.01, 6); scene.add(road2);
  roadMeshes.push(road1, road2);
  if (imageUrl) roadMeshes.forEach((rm) => { rm.visible = false; });
}
let roadMeshes = [];

// 地点标记（小圆柱 + 文字精灵）
const TOWN_OFFSETS = {
  home: [0, 0, 0], school: [0, 0, 0], library: [0, 0, 0], cafe: [0, 0, 0],
  bank: [0, 0, 0], mall: [0, 0, 0], hospital: [0, 0, 0], station: [0, 0, 0],
  bookstore: [0, 0, 0], canteen: [0, 0, 0], market: [0, 0, 0], park: [0, 0, 0], riverside: [0, 0, 0]
};

let markerGroup = new THREE.Group(); scene.add(markerGroup);
function labelSprite(text, icon) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(10,17,24,0.85)'; roundRect(ctx, 16, 30, 224, 68, 16); ctx.fill();
  ctx.strokeStyle = '#2f6bd8'; ctx.lineWidth = 4; roundRect(ctx, 16, 30, 224, 68, 16); ctx.stroke();
  ctx.fillStyle = '#d7e3ee'; ctx.font = 'bold 40px "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText((icon || '') + ' ' + text, 128, 78);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, fog: false });
  const sp = new THREE.Sprite(mat); sp.scale.set(8.5, 4.2, 1); return sp;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
let placesKey = '';
function buildPlaces(places) {
  const key = JSON.stringify(places.map(p => [p.id, p.x, p.y, p.name, p.icon]));
  if (key === placesKey) return;
  placesKey = key;
  disposeChildren(markerGroup);
  for (const p of places) {
    const v = toWorld(p.x, p.y);
    // 3D 地点只保留悬浮名牌，不再放蓝色圆柱体
    const off = TOWN_OFFSETS[p.id] || [0, 0, 0]; const label = labelSprite(p.name, p.icon || ''); label.position.set(v.x + off[0], 8.8, v.z + off[2]); markerGroup.add(label);
  }
}

// 官方 3D 小镇：程序化地面、河流、道路与低模建筑（不依赖 2D 底图）
let townGroup = new THREE.Group();
scene.add(townGroup);
let townKey = '';
const TOWN_MAT = new Map();
const TOWN_MAT_SHARED = new Set(); // 共享材质：清空分组时只释放 geometry，不释放这些材质
function townMat(color, rough = .86, metal = .02) {
  const k = color + '|' + rough + '|' + metal;
  if (!TOWN_MAT.has(k)) {
    const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
    TOWN_MAT.set(k, m);
    TOWN_MAT_SHARED.add(m);
  }
  return TOWN_MAT.get(k);
}
function townBox(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), townMat(color));
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
function townRoof(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * .72, h, 4), townMat(color, .78));
  m.rotation.y = Math.PI / 4; m.position.set(x, y, z); m.castShadow = true; return m;
}
function townTree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.15*s, .22*s, 1.2*s, 6), townMat(0x86613e, 1));
  trunk.position.y = .6*s; g.add(trunk);
  const crown = new THREE.Mesh(new THREE.ConeGeometry(.95*s, 2.2*s, 7), townMat(0x6f9f63, .95));
  crown.position.y = 2.1*s; crown.castShadow = true; g.add(crown);
  g.position.set(x, .08, z); return g;
}
function townWin(g, x, y, z, w = .55, h = .7, c = 0x35566f) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, .1), townMat(c, .35, .08));
  m.position.set(x, y, z); g.add(m);
}
function townDoor(g, x, z, c = 0x75543b) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(.7, 1.25, .12), townMat(c));
  m.position.set(x, .68, z); g.add(m);
}
function townBench(g, x, z, ry = 0) {
  const b = new THREE.Group();
  b.add(townBox(1.8, .12, .55, 0x9a744a, 0, .42, 0));
  b.add(townBox(1.8, .45, .12, 0x9a744a, 0, .68, -.24));
  for (const dx of [-.65, .65]) b.add(townBox(.12, .45, .12, 0x6f5942, dx, .22, 0));
  b.position.set(x, 0, z); b.rotation.y = ry; g.add(b);
}
function buildTown(places) {
  const key = JSON.stringify((places || []).map(p => [p.id, p.x, p.y]));
  if (key === townKey) return;
  townKey = key;
  disposeChildren(townGroup, TOWN_MAT_SHARED);
  for (const p of (places || [])) {
    const v = toWorld(p.x, p.y);
    const g = new THREE.Group();
    const off = TOWN_OFFSETS[p.id] || [0, 0, 0];
    g.position.set(v.x + off[0], .02, v.z + off[2]);
    g.add(townBox(4.6, .16, 4.0, 0xcab693, 0, .08, 0));
    const id = p.id;
    if (id === 'home') {
      g.add(townBox(4.2, 2.2, 3.6, 0xe5d3b5, 0, 1.1, 0));
      g.add(townRoof(4.2, 1.8, 3.6, 0x8e5d4b, 0, 3.0, 0));
      g.add(townBox(.28, 1.7, .28, 0x9a7a58, 1.15, 3.2, -.5));
      townDoor(g, -.65, 1.84);
      townWin(g, 1.1, 1.5, 1.86); townWin(g, -.9, 1.5, -1.86);
      for (let i = 0; i < 2; i++) g.add(townTree(-2.5 + i * 5.2, 2.2 + i, .8));
    } else if (id === 'school') {
      g.add(townBox(7.4, 4.2, 5.4, 0xe6d9c0, 0, 2.1, 0));
      g.add(townRoof(7.4, 2.0, 5.4, 0x587b99, 0, 5.3, 0));
      g.add(townBox(3.8, 1.8, 1.8, 0xdfd2b8, -4.8, 1.0, .8));
      g.add(townBox(1.6, 5.6, 1.6, 0xf2e8d5, 0, 2.8, 2.6));
      const clock = new THREE.Mesh(new THREE.CircleGeometry(.4, 20), townMat(0x465e74, .4));
      clock.position.set(0, 4.6, 3.42); g.add(clock);
      for (let i = 0; i < 6; i++) { const x = -2.5 + (i % 3) * 2.5; townWin(g, x, 1.8 + Math.floor(i / 3) * 1.5, 2.72, .8, .8, 0x507693); }
      g.add(townTree(-4.5, -3.2, 1)); g.add(townTree(4.5, -3.2, 1));
    } else if (id === 'library') {
      g.add(townBox(5.2, 3.4, 4.2, 0xe3dbc9, 0, 1.7, 0));
      g.add(townRoof(5.2, 1.6, 4.2, 0x70859e, 0, 4.1, 0));
      for (const x of [-1.8, 1.8]) g.add(townBox(.45, 2.4, .45, 0xd8c7a5, x, 1.2, 2.05));
      townDoor(g, 0, 2.12);
      g.add(townTree(-3.2, 1.5, .85));
    } else if (id === 'cafe') {
      g.add(townBox(3.9, 2.6, 3.4, 0xe6cfb2, 0, 1.3, 0));
      g.add(townRoof(3.9, 1.4, 3.4, 0xa55e4f, 0, 3.1, 0));
      g.add(townBox(3.0, .18, .95, 0xc98d72, 0, 2.0, 2.15));
      townDoor(g, -.8, 1.92);
      for (const x of [1.3, -1.4]) { const table = new THREE.Mesh(new THREE.CylinderGeometry(.55, .55, .1, 16), townMat(0xf2e8d8)); table.position.set(x, .78, 2.8); g.add(table); }
    } else if (id === 'park') {
      const fountain = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.6, .35, 24), townMat(0x9ec8d8, .5));
      fountain.position.y = .22; g.add(fountain);
      const water = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, .12, 24), townMat(0x72b6cf, .3));
      water.position.y = .42; g.add(water);
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; g.add(townTree(Math.cos(a) * 3.8, Math.sin(a) * 3.8, .9 + (i % 2) * .2)); }
      townBench(g, -4.2, .5, Math.PI / 2); townBench(g, 4.2, .5, -Math.PI / 2);
    } else if (id === 'canteen') {
      for (let i = 0; i < 3; i++) {
        const x = -2.5 + i * 2.5;
        g.add(townBox(2.2, 1.4, 1.8, 0xe6d0aa, x, .7, 0));
        g.add(townRoof(2.2, .9, 1.8, i === 1 ? 0xd27e5e : 0x90a56d, x, 1.9, 0));
        townDoor(g, x, .94);
      }
      g.add(townBox(3.2, .18, 1.2, 0xc49a68, 0, .7, 2.0));
    } else if (id === 'market') {
      for (let i = 0; i < 2; i++) {
        const x = -2.2 + i * 4.4;
        g.add(townBox(3.2, 1.2, 2.1, 0xe0c49d, x, .6, 0));
        g.add(townRoof(3.2, 1.0, 2.1, i ? 0x8c9f75 : 0xc37c63, x, 1.8, 0));
        g.add(townBox(3.4, .18, 1.0, 0xf0e3cb, x, 1.45, 1.35));
      }
      g.add(townBox(1.2, .7, 1.2, 0xa7754f, 2.9, .35, .2)); g.add(townBox(1.2, .7, 1.2, 0x9b805b, -2.9, .35, .2));
    } else if (id === 'hospital') {
      g.add(townBox(5.8, 3.4, 4.6, 0xf0ebe2, 0, 1.7, 0));
      g.add(townBox(6.2, .22, 5.0, 0xb8ccd4, 0, 3.5, 0));
      g.add(townBox(1.0, .24, .1, 0xc25552, 0, 2.5, 2.36));
      g.add(townBox(.24, 1.0, .1, 0xc25552, 0, 2.5, 2.36));
      townDoor(g, 0, 2.34, 0x59727d);
      for (const x of [-1.8, 1.8]) townWin(g, x, 2.0, 2.33, .7, .8);
    } else if (id === 'bank') {
      g.add(townBox(4.8, 4.0, 4.2, 0xe9dfd0, 0, 2.0, 0));
      g.add(townBox(5.3, .28, 4.6, 0xb69b6d, 0, 4.15, 0));
      g.add(townBox(4.8, .4, .5, 0xd8bd91, 0, 4.5, 2.2));
      for (const x of [-2.4, 2.4]) g.add(townBox(.35, 3.0, .35, 0xd8c4a2, x, 1.5, 2.2));
      townDoor(g, 0, 2.42, 0x786044);
    } else if (id === 'mall') {
      g.add(townBox(7.0, 5.0, 5.4, 0xc8d1c7, 0, 2.5, 0));
      g.add(townBox(7.4, .24, 5.8, 0x7f9394, 0, 5.1, 0));
      g.add(townBox(4.4, .9, .15, 0x557d8a, 0, 3.8, 2.73));
      for (let i = 0; i < 4; i++) townWin(g, -2.4 + i * 1.6, 2.0, 2.72, .9, 1.0, 0x7095a1);
      townDoor(g, 0, 2.76, 0x4f6670);
    } else if (id === 'station') {
      g.add(townBox(8.4, .3, 5.2, 0xc7b89d, 0, .15, 0));
      g.add(townBox(8.8, .25, 5.6, 0x4f7d93, 0, 3.1, -1.0));
      for (const x of [-3.6, 3.6]) g.add(townBox(.16, 3.0, .16, 0x50606a, x, 1.55, -1.0));
      for (const z of [-2.8, 2.8]) g.add(townBox(8.2, .16, .18, 0x9d8c72, 0, .32, z));
      townBench(g, -2.5, 1.5); townBench(g, 2.5, 1.5);
    } else if (id === 'riverside') {
      for (let i = 0; i < 6; i++) g.add(townTree(-3 + i * 1.2, -2 + (i % 3) * 2.2, .8 + (i % 2) * .25));
      townBench(g, -2, .2, .4); townBench(g, 2.2, -.2, -.4);
    } else if (id === 'bookstore') {
      g.add(townBox(4.4, 2.8, 3.8, 0xd9d0bc, 0, 1.4, 0));
      g.add(townRoof(4.4, 1.4, 3.8, 0x7b8c9b, 0, 3.2, 0));

    pos.push(p.x + nx * width / 2, y, p.z + nz * width / 2);

function ensureVehicles(map) {
  const key = JSON.stringify(map.vehicles || {});
  if (key === vehiclesKey) return;
  vehiclesKey = key;
  disposeChildren(vehicleGroup, TOWN_MAT_SHARED);
  const cfg = map.vehicles || {};
  const makeGroup = (kind) => {
    const g = new THREE.Group(); g.visible = false;
    const c = cfg[kind];
    if (c && c.url) {
      new GLTFLoader().load(c.url, (gltf) => {
        if (vehiclesKey !== key) { disposeObject3D(gltf.scene); return; }
        const obj = gltf.scene;
        obj.scale.setScalar(Number(c.scale) || 1);
        obj.rotation.y = Number(c.rotationY) || 0;
        obj.position.y = .12;
        g.add(obj);
      }, undefined, () => {
        if (vehiclesKey !== key) return;
        hudError('载具模型加载失败，已用默认模型：' + c.url);
        g.add(kind === 'car' ? vehicleCar() : vehicleBike());
      });
    } else {
      g.add(kind === 'car' ? vehicleCar() : vehicleBike());
    }
    const tag = labelSprite(kind === 'car' ? '汽车' : '自行车', '');
    tag.scale.set(3.4, 1.7, 1); tag.position.set(0, kind === 'car' ? 3.3 : 2.6, 0); g.add(tag);
    vehicleGroup.add(g); return g;
  };
  carGroup = makeGroup('car');
  bikeGroup = makeGroup('bicycle');
  vehicleGroup.visible = false;
}

function playCharClip(name, manual) {
  if (manual) { charClipOverride = String(name || ''); charClipOverrideUntil = Date.now() + 8000; desiredCharClip = String(name || 'Idle'); }
  const want = String(name || desiredCharClip || 'Idle').toLowerCase();
  if (!charActions || !charActions.length) { desiredCharClip = String(name || desiredCharClip || 'Idle'); return; }
  let action = charActions.find((a) => String(a.getClip && a.getClip().name || '').toLowerCase() === want);
  if (!action) action = charActions.find((a) => String(a.getClip && a.getClip().name || '').toLowerCase() === 'idle') || charActions[0];
  if (!action || action === activeCharAction) return;

  action.reset().fadeIn(0.18).play();
  activeCharAction = action;
}

function buildChibi(character) {
  const g = new THREE.Group();
  const cp = (character && character.chibi) || {};
  const dressCol = Number(cp.dress) || 0x7fa9df, hairCol = Number(cp.hair) || 0x5d7fc4, skinCol = Number(cp.skin) || 0xffe4cf, accentCol = Number(cp.accent) || 0x4f72b8;
  const blue = townMat(dressCol, .8), hair = townMat(hairCol, .85), skin = townMat(skinCol, .9);
  const dress = new THREE.Mesh(new THREE.ConeGeometry(1.05, 1.8, 12), blue);
  dress.position.y = 1.0; dress.castShadow = true; g.add(dress);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.78, 16, 12), skin);
  head.position.y = 2.35; head.castShadow = true; g.add(head);
  const hairCap = new THREE.Mesh(new THREE.SphereGeometry(.86, 16, 12), hair);
  hairCap.position.y = 2.58; hairCap.scale.y = .82; g.add(hairCap);
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.28, .8, 6), townMat(accentCol, .8));
    ear.position.set(s * .9, 2.25, -.05); ear.rotation.z = s * .55; g.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 6), townMat(0x273a5a, .4));
    eye.position.set(s * .28, 2.38, .72); g.add(eye);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, .85, 8), skin);
    arm.position.set(s * .72, 1.55, .1); arm.rotation.z = s * .35; g.add(arm);
  }
  const tail = new THREE.Mesh(new THREE.ConeGeometry(.36, 1.1, 8), townMat(hairCol, .75));
  tail.position.set(0, .95, -1.0); tail.rotation.x = 1.0; g.add(tail);
  const tag = labelSprite((character && character.name) || '小鲸', '');
  tag.scale.set(5.5, 2.75, 1); tag.position.set(0, 4.6, 0); g.add(tag);

}
async function buildChar(character) {
  const model = character.model || { type: 'none', url: '', scale: 1 };
  const kindKey = model.type + '|' + (model.url || '') + '|' + (model.scale || 1) + '|' + (character.id || '') + '|' + JSON.stringify(character.chibi || {});
  if (kindKey === charKind) return;
  charKind = kindKey;
  clearChar();
  const scale = Number(model.scale) || 1;
  const loader = new THREE.TextureLoader();
  const makeSprite = (url, height = 20) => new Promise((resolve) => {
    loader.load(url, (tex) => {
      if (charKind !== kindKey) { tex.dispose(); resolve(); return; }
      spriteTex = tex;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false });
      const sp = new THREE.Sprite(mat);
      const aspect = (tex.image && tex.image.width && tex.image.height) ? tex.image.width / tex.image.height : 1;
      sp.scale.set(height * aspect, height, 1);
      charGroup.add(sp); spritePlane = sp; resolve();
    }, undefined, () => resolve());
  });
  const makeFallback = () => {
    fallbackBody = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(1.4, 4, 6, 12), new THREE.MeshStandardMaterial({ color: 0x5f8fe8, roughness: .5 }));
    body.position.y = 3.4; fallbackBody.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(1.5, 20, 16), new THREE.MeshStandardMaterial({ color: 0xffe9dc, roughness: .6 }));
    head.position.y = 7.2; fallbackBody.add(head);
    charGroup.add(fallbackBody);
  };
  const blob = new THREE.Mesh(new THREE.CircleGeometry(3.2, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.02; charGroup.add(blob); shadowBlob = blob;
  const ring = new THREE.Mesh(new THREE.RingGeometry(3.4, 4.2, 32), new THREE.MeshBasicMaterial({ color: 0x59a6ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; charGroup.add(ring);
  if (model.type === '3d' && model.url) {
    try {
      const gltf = await new GLTFLoader().loadAsync(model.url);
      if (charKind !== kindKey) { disposeObject3D(gltf.scene); return; }
      gltf.scene.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      charModel = gltf.scene;
      charModel.scale.setScalar(scale);
      charModel.rotation.y = Number(model.rotationY) || 0;
      const box = new THREE.Box3().setFromObject(charModel);
      charModel.position.y = -box.min.y;
      charGroup.add(charModel);
      const clips = gltf.animations || [];
      charActions = clips.map((clip) => new THREE.AnimationMixer(charModel).clipAction(clip));
      if (charActions.length) { mixer = new THREE.AnimationMixer(charModel); charActions = clips.map((clip) => mixer.clipAction(clip)); playCharClip(desiredCharClip || 'Idle'); }
    } catch (e) {
      if (charKind !== kindKey) return;
      makeFallback();
      hudError('角色模型加载失败，已用兜底形象：' + (e && e.message ? e.message : e));
    }
  } else if ((model.type === 'sprite' || model.type === 'live2d') && model.url) {
    await makeSprite(model.url, 9 * scale);
    if (charKind !== kindKey) return;
    if (!spritePlane) makeFallback();
  } else if (character.avatar) {
    await makeSprite(character.avatar, 9 * scale);
    if (charKind !== kindKey) return;
    // 3D 视图里头像贴图会变成一块大白板，先用位置标记代替，保持画面干净
    if (spritePlane) spritePlane.visible = false;
    if (!spritePlane) makeFallback();
  } else {
    makeFallback();
  }
  if (charKind !== kindKey) return;
  if (fallbackBody) fallbackBody.visible = false;
  if (spritePlane) spritePlane.visible = false;
  // 3D/GLB 模型已经加载时不要再叠一个程序化小人，否则会出现两个小鲸
  if (!charModel) charGroup.add(buildChibi(character));
}

// 路径线
let routeLine = null;
function drawPath(path) {
  if (routeLine) { scene.remove(routeLine); disposeObject3D(routeLine); routeLine = null; }
  if (!path || path.length < 2) return;
  const pts = path.map(p => { const v = toWorld(p.x, p.y); v.y = 0.3; return v; });
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({ color: 0x7db7ff, dashSize: 2.4, gapSize: 1.2, linewidth: 3 });
  routeLine = new THREE.Line(geo, mat); routeLine.computeLineDistances(); scene.add(routeLine);
}

// 状态轮询
let stage = null, pollBusy = false;
async function poll() {
  if (pollBusy) return;          // 上一轮未完成，跳过本轮，避免请求堆积/数据乱序
  pollBusy = true;
  try {
    const r = await fetch('/api/stage');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    stage = await r.json(); apply(); hudError('', 'hudErrPoll');
  } catch (e) {
    hudError('stage 拉取失败：' + (e && e.message ? e.message : e), 'hudErrPoll');
  } finally {
    pollBusy = false;
  }
}
function characterWorldPos() {
  if (!stage) return new THREE.Vector3();
  const loc = stage.location;
  if (loc.state === 'stationary') {
    const p = stage.map.places.find(x => x.id === loc.placeId) || { x: 0.5, y: 0.5 };
    return toWorld(p.x, p.y);
  }
  if (loc.state === 'traveling' && loc.traveling && loc.traveling.path && loc.traveling.path.length > 1) {
    const t = loc.traveling;
    const path = t.path;
    const prog = Math.min(1, Math.max(0, (Date.now() - t.startedAt) / Math.max(1, t.durationMs)));
    let total = 0; const segs = [];
    for (let i = 0; i < path.length - 1; i++) { const d = Math.hypot(path[i].x - path[i + 1].x, path[i].y - path[i + 1].y); segs.push(d); total += d; }
    let target = total * prog;
    for (let i = 0; i < segs.length; i++) {
      if (target <= segs[i] || i === segs.length - 1) {
        const r = segs[i] ? target / segs[i] : 0;
        const nx = path[i].x + (path[i + 1].x - path[i].x) * Math.min(1, Math.max(0, r));
        const ny = path[i].y + (path[i + 1].y - path[i].y) * Math.min(1, Math.max(0, r));
        return toWorld(nx, ny);
      }
      target -= segs[i];
    }
  }
  return toWorld(0.5, 0.2);
}
function apply() {
  if (!stage) return;
  if (!stage.map || stage.map.has3d !== true) {
    const ld = document.getElementById('loading');
    if (ld) { ld.style.display = 'flex'; ld.innerHTML = '<div style="max-width:520px;padding:28px 36px;border:1px solid rgba(120,160,220,.35);border-radius:18px;background:rgba(10,20,35,.86);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)"><div style="font-size:22px;font-weight:600;color:#dce9fb;margin-bottom:8px">这张地图没有 3D 资源</div><div style="font-size:13px;color:#8fa8c4;line-height:1.7">当前地图只提供了 2D 底图和地点标<br>可以打开 2D 舞台查看</div></div>'; }
    return;
  }
  const ld0 = document.getElementById('loading'); if (ld0) ld0.style.display = 'none';
  const loc = stage.location, ch = stage.character;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hName').textContent = ch.name || '她';
  const where = loc.state === 'intercity' ? ('前往 ' + (loc.intercity && loc.intercity.toMapName))
    : loc.state === 'traveling' ? ('去 ' + (loc.traveling && loc.traveling.toName) + ' 的路上')
    : (loc.icon + ' ' + loc.placeName + ' · ' + stage.map.name);
  document.getElementById('hWhere').textContent = where + ' · ' + stage.weather.icon + stage.weather.label + (stage.weather.temp !== null && stage.weather.temp !== undefined ? ' ' + stage.weather.temp + '°C' : '');
  const wm2 = stage.wallet;
  const hm = document.getElementById('hMoney');
  if (hm) hm.textContent = wm2 ? ('💰 ' + (wm2.spendable !== undefined ? wm2.spendable : wm2.balance) + ' 元 · 🪙 剩余 ' + Number(wm2.remainingTokens || 0).toLocaleString() + ' token') : '';
  document.getElementById('hStatus').textContent = '体力 ' + stage.energy + ' · ' + stage.animationHint
    + (loc.state === 'traveling' ? ' · ' + loc.traveling.modeLabel + ' · 剩 ' + Math.max(1, Math.ceil(loc.traveling.etaSec / 60)) + ' 分钟' : '');
  const phase = (function(h){ if (h>=5&&h<7) return 'dawn'; if (h>=7&&h<17) return 'day'; if (h>=17&&h<19.5) return 'dusk'; return 'night'; })(new Date().getHours() + new Date().getMinutes()/60);
  const wxKind = (stage.weather && stage.weather.kind) || 'sunny';
  if (window.CompanionWeatherFx) CompanionWeatherFx.set(document.getElementById('wxOverlay'), wxKind, (stage.weather && stage.weather.fx) || {});
  let wxSky = { rain: 0x1a2531, snow: 0x2a3640, sunny: 0x0d1a24, hot: 0x2a1a12, cold: 0x16222e, windy: 0x19232c, cloudy: 0x141d26 }[wxKind] || 0x0d1a24;
  const todSky = { dawn: 0x3a2a3a, day: 0x0d1a24, dusk: 0x2a1a24, night: 0x05070f }[phase];
  if (phase === 'night') wxSky = 0x05070f;
  else if (phase === 'dawn' || phase === 'dusk') wxSky = new THREE.Color(wxSky).lerp(new THREE.Color(todSky), 0.45).getHex();
  scene.background = new THREE.Color(wxSky);
  scene.fog.color.set(wxSky);
  const dayFactor = phase === 'day' ? 1 : phase === 'dawn' || phase === 'dusk' ? 0.7 : 0.35;
  hemi.intensity = phase === 'day' ? 1.0 : phase === 'night' ? 0.35 : 0.68;
  ambient.intensity = phase === 'day' ? 0.65 : phase === 'night' ? 0.22 : 0.45;
  dir.intensity = (wxKind === 'rain' || wxKind === 'snow' ? 1.5 : (wxKind === 'sunny' ? 2.4 : 2.0)) * dayFactor;
  const mapImageUrl = stage.map.image && stage.map.image.url ? stage.map.image.url : '';
  const official3d = String(mapImageUrl).includes('official-map');
  buildGround(stage.map.theme, official3d ? '' : mapImageUrl, stage.map.has3d === true);
  buildEnv(stage.map);
  buildTown(stage.map.places);
  if (official3d) {
    terrainGroup.visible = true;
    townGroup.visible = true;
    buildOfficialTerrain(stage.map);
    if (ground) ground.visible = false;
    if (grid) grid.visible = false;
    if (basePlane) basePlane.visible = false;
    try { roadMeshes.forEach((rm) => { rm.visible = false; }); } catch (e) {}
  } else {
    disposeChildren(terrainGroup, TOWN_MAT_SHARED); terrainKey = '';
    terrainGroup.visible = false;
    if (ground) ground.visible = true;
    if (basePlane) basePlane.visible = true;
    townGroup.visible = !mapImageUrl;
  }
  buildPlaces(stage.map.places);
  if (charClipOverride && Date.now() > charClipOverrideUntil) charClipOverride = '';
  desiredCharClip = charClipOverride || (loc.state === 'traveling' ? 'Walk' : 'Idle');
  playCharClip(desiredCharClip);
  buildChar(ch).catch(() => {});
  ensureVehicles(stage.map);
  const travelMode = String((loc.traveling && loc.traveling.mode) || '');
  const carMode = loc.state === 'traveling' && /car|taxi|drive|auto/.test(travelMode);
  const bikeMode = loc.state === 'traveling' && /bike|bicycle|cycle/.test(travelMode);
  const previewVehicles = new URLSearchParams(location.search).get('previewVehicles') === '1';
  if (previewVehicles && carGroup && bikeGroup) {
    carGroup.visible = true; bikeGroup.visible = true;
    carGroup.scale.setScalar(1.25); bikeGroup.scale.setScalar(1.4);
    carGroup.position.set(-8.0, 0, 3.8); bikeGroup.position.set(8.0, 0, 3.6);
    carGroup.rotation.y = -.35; bikeGroup.rotation.y = .35;
    vehicleGroup.visible = true;
    charGroup.visible = false;
  } else {
    if (carGroup) { carGroup.visible = carMode; carGroup.position.set(0,0,0); carGroup.rotation.y = 0; carGroup.scale.setScalar(1); }
    if (bikeGroup) { bikeGroup.visible = bikeMode; bikeGroup.position.set(0,0,0); bikeGroup.rotation.y = 0; bikeGroup.scale.setScalar(1); }
    vehicleGroup.visible = carMode || bikeMode;
    charGroup.visible = !(carMode || bikeMode);
  }
  drawPath(loc.state === 'traveling' && loc.traveling ? loc.traveling.path : null);
}

// 地图模型（3D 地图导入）
let envGroup = new THREE.Group(); scene.add(envGroup);
let envKey = '';
async function buildEnv(map) {
  const model = map.model;
  const key = model && model.url ? (model.url + '|' + (model.scale || 1) + '|' + (model.rotationY || 0) + '|' + (model.yOffset || 0)) : 'proc|' + (map.theme || 'town');
  if (key === envKey) return;
  envKey = key;
  disposeChildren(envGroup, TOWN_MAT_SHARED);
  const hideProcedural = !!(model && model.url);
  if (ground) ground.visible = !hideProcedural;
  if (grid) grid.visible = !hideProcedural;
  for (const r of roadMeshes || []) r.visible = !hideProcedural;
  if (!hideProcedural) return;
  try {
    const gltf = await new GLTFLoader().loadAsync(model.url);
    if (envKey !== key) { disposeObject3D(gltf.scene); return; }
    const obj = gltf.scene;
    obj.scale.setScalar(Number(model.scale) || 1);
    obj.rotation.y = (Number(model.rotationY) || 0) * Math.PI / 180;
    obj.position.y = Number(model.yOffset) || 0;
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    envGroup.add(obj);
  } catch (e) {
    if (envKey !== key) return;
    hudError('地图模型加载失败：' + (e && e.message ? e.message : e));
    if (ground) ground.visible = true;
    if (grid) grid.visible = true;
    for (const r of roadMeshes || []) r.visible = true;
  }
}

// 相机：跟随 + 拖拽旋转 + 滚轮缩放
let camTarget = new THREE.Vector3(0, 0, 0);
let yaw = 0.9, pitch = 0.72, dist = 100;
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch = Math.min(1.35, Math.max(0.18, pitch - (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.min(260, Math.max(30, dist + (e.deltaY > 0 ? 8 : -8)));
}, { passive: false });
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  if (document.hidden) return;   // 页面隐藏时跳过渲染；delta 已封顶，恢复时不会跳帧
  const p = characterWorldPos();
  // 站在建筑前侧，避免小鲸被地点建筑盖住
  p.x += 1.6; p.z += 2.6;
  const focus = p.clone();
  camTarget.lerp(focus, 0.08);
  const cx = camTarget.x + Math.sin(yaw) * Math.cos(pitch) * dist;
  const cz = camTarget.z + Math.cos(yaw) * Math.cos(pitch) * dist;
  const cyv = camTarget.y + 6 + Math.sin(pitch) * dist;
  camera.position.lerp(new THREE.Vector3(cx, cyv, cz), 0.1);
  camera.lookAt(camTarget.x, camTarget.y + 5, camTarget.z);
  const prev = charGroup.position.clone();
  charGroup.position.lerp(p, 0.12);
  vehicleGroup.position.copy(charGroup.position);
  if (spritePlane) spritePlane.lookAt(camera.position);
  for (const c of charGroup.children) { if (c.isSprite && c.position.y > 20) c.lookAt(camera.position); }
  const st = stage && stage.location ? stage.location : null;
  const traveling = !!(st && st.traveling);
  if (traveling) {
    const dx = charGroup.position.x - prev.x, dz = charGroup.position.z - prev.z;
    if (Math.abs(dx) + Math.abs(dz) > 0.0005) {
      const targetYaw = Math.atan2(dx, dz);
      let cur = charGroup.rotation.y;
      let d = targetYaw - cur;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      charGroup.rotation.y = cur + d * 0.15;
    }
    charGroup.position.y = Math.abs(Math.sin(performance.now() / 160)) * 0.35;
  } else {
    charGroup.position.y *= 0.9;
  }
  if (mixer) mixer.update(delta);
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
poll(); setInterval(poll, 1000);
animate();
