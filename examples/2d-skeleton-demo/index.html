<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小鲸 · 2D 骨骼角色（真实贴图 + rig.json 预览）</title>
<style>
  :root { --ink: #e9eefc; --muted: #93a1c4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: radial-gradient(1100px 560px at 50% 0%, #26305a 0%, #121726 62%, #0b0f1a 100%);
    font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 22px 16px 40px;
    user-select: none;
  }
  h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .stage {
    position: relative; width: min(920px, 96vw); height: 460px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, #2a3452 0%, #3a4a70 60%, #2e3852 60.5%, #262f47 100%);
    border: 1px solid rgba(120,150,220,.22);
    box-shadow: 0 14px 40px rgba(0,0,0,.45), inset 0 0 60px rgba(0,0,0,.35);
  }
  .ground-line { position: absolute; left: 0; right: 0; bottom: 70px; height: 1px; background: rgba(255,255,255,.06); }
  .avatar-wrap {
    position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%);
    transition: left .08s linear;
  }
  .avatar-wrap.flip { transform: translateX(-50%) scaleX(-1); }
  .avatar { position: relative; }
  .part-anchor { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  .part-anchor img { position: absolute; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.28)); }
  .shadow { position: absolute; left: 50%; bottom: 2px; width: 74px; height: 12px; margin-left: -37px; border-radius: 50%;
    background: radial-gradient(rgba(0,0,0,.45), rgba(0,0,0,0) 70%); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; justify-content: center; }
  .group { display: flex; align-items: center; gap: 6px; background: rgba(18,24,38,.75);
    border: 1px solid rgba(130,160,230,.18); border-radius: 10px; padding: 6px 9px; }
  .group .label { color: var(--muted); font-size: 11px; }
  button { appearance: none; border: 1px solid rgba(140,170,240,.28); background: rgba(60,80,130,.35);
    color: var(--ink); font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  button.on { background: #4f7cf0; border-color: #7ba0ff; color: #fff; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; text-align: center; line-height: 1.7; }
  .err { color: #ffb4b4; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>小鲸 · 2D 骨骼角色</h1>
  <div class="sub">真实 AI 贴图（9 层）+ rig.json 骨骼 + 程序化 idle / walk（需要本地起一个静态服务打开，file:// 下 fetch 会被拦）</div>

  <div class="stage" id="stage">
    <div class="ground-line"></div>
    <div class="avatar-wrap" id="wrap">
      <div class="avatar" id="avatar"></div>
      <div class="shadow"></div>
    </div>
  </div>
  <div class="err" id="err"></div>

  <div class="controls">
    <div class="group">
      <span class="label">动作</span>
      <button id="btnIdle" class="on">待机</button>
      <button id="btnWalk">走路</button>
    </div>
    <div class="group">
      <span class="label">朝向</span>
      <button id="btnDir">右</button>
    </div>
    <div class="group">
      <span class="label">衣服染色（演示换装的一半）</span>
      <button id="btnTint0" class="on">原色</button>
      <button id="btnTint1">偏紫</button>
      <button id="btnTint2">偏绿</button>
    </div>
  </div>
  <div class="hint">
    文件：<code>assets/rig.json</code> + <code>assets/*.png</code>；
    换成你自己的角色 = 同画布分层透明 PNG（同名覆盖）+ 改 rig.json 的关节/box/pivot。
  </div>

<script>
(async function () {
  'use strict'
  const AVATAR_H = 340            // 展示高度（像素）
  const stage = document.getElementById('stage')
  const wrap = document.getElementById('wrap')
  const avatarEl = document.getElementById('avatar')
  const errEl = document.getElementById('err')

  let rig
  try {
    rig = await (await fetch('assets/rig.json', { cache: 'no-store' })).json()
  } catch (e) {
    errEl.textContent = '加载 assets/rig.json 失败：' + e.message + '（用静态服务器打开，别用 file://）'
    return
  }
  const k = AVATAR_H / rig.canvas[1]
  avatarEl.style.width = rig.canvas[0] * k + 'px'
  avatarEl.style.height = rig.canvas[1] * k + 'px'
  avatarEl.style.position = 'relative'

  const PART_BONE = { head: 'head', hairBack: 'hairBack', torso: 'chest', armL: 'armL', armR: 'armR', skirt: 'hips', legL: 'legL', legR: 'legR', tail: 'tail' }
  const parts = Object.keys(rig.parts)
    .filter((n) => PART_BONE[n] && rig.bones[PART_BONE[n]])
    .sort((a, b) => (Number(rig.z[a]) || 0) - (Number(rig.z[b]) || 0))

  const nodes = {}
  for (const name of parts) {
    const info = rig.parts[name]
    const box = info.box
    const bonePos = (rig.bones[PART_BONE[name]] && rig.bones[PART_BONE[name]].pos) || [0, 0]
    const anchor = document.createElement('div')
    anchor.className = 'part-anchor'
    anchor.style.zIndex = Math.round(Number(rig.z[name]) || 0)
    const img = document.createElement('img')
    img.src = info.file + '?v=' + Date.now()
    img.alt = ''
    img.draggable = false
    // 贴图相对骨骼的偏移 = 贴图左上角 - 骨骼点（围绕骨骼点旋转）
    img.style.left = (box[0] - bonePos[0]) * k + 'px'
    img.style.top = (box[1] - bonePos[1]) * k + 'px'
    img.style.width = (box[2] - box[0]) * k + 'px'
    img.style.height = (box[3] - box[1]) * k + 'px'
    img.dataset.part = name
    anchor.appendChild(img)
    avatarEl.appendChild(anchor)
    nodes[name] = anchor
  }

  // 骨骼拓扑
  const order = []
  const visit = (n) => { if (!rig.bones[n] || order.includes(n)) return; const p = rig.bones[n].parent; if (p) visit(p); order.push(n) }
  Object.keys(rig.bones).forEach(visit)

  const state = { mode: 'idle', dir: 1, phase: 0, t: Math.random() * 10, tint: 0 }

  document.getElementById('btnIdle').addEventListener('click', (e) => {
    state.mode = 'idle'; toggle(e.target, 'btnIdle', 'btnWalk')
  })
  document.getElementById('btnWalk').addEventListener('click', (e) => {
    state.mode = 'walk'; toggle(e.target, 'btnWalk', 'btnIdle')
  })
  document.getElementById('btnDir').addEventListener('click', (e) => {
    state.dir = -state.dir
    wrap.classList.toggle('flip', state.dir < 0)
    e.target.textContent = state.dir > 0 ? '右' : '左'
  })
  document.getElementById('btnTint0').addEventListener('click', (e) => setTint(e.target, 0))
  document.getElementById('btnTint1').addEventListener('click', (e) => setTint(e.target, 1))
  document.getElementById('btnTint2').addEventListener('click', (e) => setTint(e.target, 2))

  function toggle(el, onId, offId) {
    el.classList.add('on')
    document.getElementById(offId).classList.remove('on')
  }
  function setTint(el, n) {
    state.tint = n
    ;['btnTint0', 'btnTint1', 'btnTint2'].forEach((id, i) => document.getElementById(id).classList.toggle('on', i === n))
    const filters = ['', 'hue-rotate(35deg) saturate(1.1)', 'hue-rotate(-60deg) saturate(1.15)']
    ;['torso', 'skirt'].forEach((n) => {
      const img = nodes[n].querySelector('img')
      img.style.filter = filters[n] + ' drop-shadow(0 2px 3px rgba(0,0,0,.28))'
    })
  }

  function motion(kind, t, phase) {
    const o = {}
    if (kind === 'walk') {
      const p = phase
      o.legL = 20 * Math.sin(p); o.legR = -20 * Math.sin(p)
      o.armL = -15 * Math.sin(p); o.armR = 15 * Math.sin(p)
      o.chest = 2.2 * Math.sin(2 * p); o.head = -1.8 * Math.sin(2 * p)
      o.hairBack = 1.6 * Math.sin(p + 1.2); o.tail = 4 * Math.sin(p * 0.9 + 0.4)
      o.bob = -14 * Math.abs(Math.sin(p))
    } else {
      const b = Math.sin(t * 1.6)
      o.legL = 0.8; o.legR = -0.8
      o.armL = 1.6 + b * 1.1; o.armR = -1.6 - b * 1.1
      o.chest = b * 1.1; o.head = -0.8 - b * 0.7
      o.hairBack = 0.7 * Math.sin(t * 0.8); o.tail = 3 * Math.sin(t * 1.05)
      o.bob = 0
    }
    return o
  }

  let last = 0
  function frame(now) {
    if (!last) last = now
    const dt = Math.min(0.06, (now - last) / 1000); last = now
    if (state.mode === 'walk') state.phase += dt * 7.4
    else state.t += dt
    const angles = motion(state.mode, state.t, state.phase)
    const world = {}
    for (const name of order) {
      const bone = rig.bones[name]
      const local = angles[name] || 0
      if (!bone.parent) {
        world[name] = { x: bone.pos[0], y: bone.pos[1] + (angles.bob || 0), ang: local }
      } else {
        const pw = world[bone.parent], pb = rig.bones[bone.parent]
        const dx = bone.pos[0] - pb.pos[0], dy = bone.pos[1] - pb.pos[1]
        const rad = pw.ang * Math.PI / 180
        world[name] = {
          x: pw.x + dx * Math.cos(rad) - dy * Math.sin(rad),
          y: pw.y + dx * Math.sin(rad) + dy * Math.cos(rad),
          ang: pw.ang + local,
        }
      }
    }
    for (const name of parts) {
      const w = world[PART_BONE[name]]
      const el = nodes[name]
      if (!w || !el) continue
      el.style.transform = 'translate3d(' + (w.x * k).toFixed(2) + 'px,' + (w.y * k).toFixed(2) + 'px,0) rotate(' + w.ang.toFixed(2) + 'deg)'
    }
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
})()
</script>
</body>
</html>
